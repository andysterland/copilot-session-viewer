name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [22.x]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build frontend
        run: npm run build
      
      - name: Run linter
        run: npm run lint:check
      
      - name: Run unit tests
        run: npm test
        env:
          DISABLE_TELEMETRY: 'true'

  e2e:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build (Vite frontend + esbuild backend)
        run: npm run build
      
      - name: Pack tarball
        run: npm pack
      
      - name: Verify tarball contents
        run: |
          TARBALL=$(ls *.tgz)
          echo "--- Tarball contents ---"
          tar tzf "$TARBALL" | head -30
          echo "--- Checking required files ---"
          tar tzf "$TARBALL" | grep -q "dist/server.min.js" && echo "✅ dist/server.min.js"
          tar tzf "$TARBALL" | grep -q "dist/client/index.html" && echo "✅ dist/client/index.html"
          tar tzf "$TARBALL" | grep -qE "dist/client/assets/index-.*\.js" && echo "✅ Vite JS bundle"
          tar tzf "$TARBALL" | grep -qE "dist/client/assets/index-.*\.css" && echo "✅ Vite CSS bundle"
          tar tzf "$TARBALL" | grep -q "bin/copilot-session-viewer" && echo "✅ CLI entry"
          echo "--- Checking source files excluded ---"
          ! tar tzf "$TARBALL" | grep -q "src/" && echo "✅ No src/ in tarball"
          ! tar tzf "$TARBALL" | grep -q "__tests__/" && echo "✅ No __tests__/ in tarball"
      
      - name: Setup test session directories
        run: |
          mkdir -p ~/.copilot/session-state
          mkdir -p ~/.claude/projects
          mkdir -p ~/.pi/agent/sessions
      
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      
      - name: Install tarball into temp project (smoke test it installs cleanly)
        run: |
          TARBALL="$(ls $GITHUB_WORKSPACE/*.tgz)"
          mkdir -p /tmp/tgz-test
          cd /tmp/tgz-test
          npm init -y > /dev/null
          npm install "$TARBALL" > /dev/null 2>&1
          chmod +x node_modules/.bin/copilot-session-viewer 2>/dev/null || true
          # Quick smoke test: server starts and serves SPA index from tarball
          export PORT=3839
          export DISABLE_TELEMETRY=true
          node node_modules/@qiaolei81/copilot-session-viewer/dist/server.min.js &
          SERVER_PID=$!
          sleep 5
          curl -sf http://localhost:3839/ > /dev/null && echo "✅ Tarball server smoke test passed"
          kill $SERVER_PID 2>/dev/null || true
      
      - name: Run E2E tests (playwright spawns its own server with fixture env)
        run: npm run test:e2e
        env:
          DISABLE_TELEMETRY: 'true'
      
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7
