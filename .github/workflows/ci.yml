name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: read

jobs:
  web-unit:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [22.x]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build frontend
        run: npm run build
      
      - name: Run linter
        run: npm run lint:check
      
      - name: Run unit tests
        run: npm test
        env:
          DISABLE_TELEMETRY: 'true'

  web-e2e-and-package:
    runs-on: ubuntu-latest
    needs: web-unit
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build (Vite frontend + esbuild backend)
        run: npm run build
      
      - name: Pack tarball
        run: npm pack
      
      - name: Verify tarball contents
        run: |
          set -euo pipefail
          TARBALL="$(find . -maxdepth 1 -name '*.tgz' -print -quit)"
          test -n "$TARBALL"
          CONTENTS="$(tar tzf "$TARBALL")"
          require_file() {
            grep -qE "$1" <<<"$CONTENTS" || {
              echo "::error::Missing required tarball entry matching $1"
              exit 1
            }
            echo "✅ $2"
          }
          forbid_file() {
            if grep -qE "$1" <<<"$CONTENTS"; then
              echo "::error::Unexpected tarball entry matching $1"
              exit 1
            fi
            echo "✅ $2"
          }
          echo "--- Tarball contents ---"
          sed -n '1,30p' <<<"$CONTENTS"
          echo "--- Checking required files ---"
          require_file '^package/dist/server\.min\.js$' 'dist/server.min.js'
          require_file '^package/dist/zipExtractorWorker\.js$' 'dist/zipExtractorWorker.js'
          require_file '^package/dist/client/index\.html$' 'dist/client/index.html'
          require_file '^package/dist/client/assets/index-.*\.js$' 'Vite JS bundle'
          require_file '^package/dist/client/assets/index-.*\.css$' 'Vite CSS bundle'
          require_file '^package/bin/copilot-session-viewer$' 'CLI entry'
          echo "--- Checking source files excluded ---"
          forbid_file '^package/src/' 'No src/ in tarball'
          forbid_file '^package/__tests__/' 'No __tests__/ in tarball'
          forbid_file '^package/electron/' 'No Electron host in npm tarball'
          forbid_file '^package/electron-builder\.yml$' 'No desktop packaging config in npm tarball'
      
      - name: Setup test session directories
        run: |
          mkdir -p ~/.copilot/session-state
          mkdir -p ~/.claude/projects
          mkdir -p ~/.pi/agent/sessions
      
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      
      - name: Install tarball into temp project (smoke test it installs cleanly)
        run: |
          TARBALL="$(ls $GITHUB_WORKSPACE/*.tgz)"
          mkdir -p /tmp/tgz-test
          cd /tmp/tgz-test
          npm init -y > /dev/null
          npm install "$TARBALL" > /dev/null 2>&1
          chmod +x node_modules/.bin/copilot-session-viewer 2>/dev/null || true
          # Quick smoke test: server starts and serves SPA index from tarball
          export PORT=3839
          export DISABLE_TELEMETRY=true
          node node_modules/@qiaolei81/copilot-session-viewer/dist/server.min.js &
          SERVER_PID=$!
          sleep 5
          curl -sf http://localhost:3839/ > /dev/null && echo "✅ Tarball server smoke test passed"
          kill $SERVER_PID 2>/dev/null || true
      
      - name: Run E2E tests (playwright spawns its own server with fixture env)
        run: npm run test:e2e
        env:
          DISABLE_TELEMETRY: 'true'
      
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7

  electron-unit:
    name: Electron unit and security tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci
      - run: npm run test:electron
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  electron-e2e:
    name: Electron Playwright smoke
    runs-on: ubuntu-latest
    needs: electron-unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: xvfb-run --auto-servernum npm run test:electron:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: electron-e2e-results
          path: test-results/
          retention-days: 14

  electron-package:
    name: Electron package (${{ matrix.os }})
    needs: [web-unit, electron-unit]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            command: electron:dist:win
            artifact: windows
          - os: macos-latest
            command: electron:dist:mac
            artifact: macos
          - os: ubuntu-latest
            command: electron:dist:linux
            artifact: linux
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci
      - run: npm run ${{ matrix.command }}
      - run: npm run electron:checksums
      - uses: actions/upload-artifact@v4
        with:
          name: electron-unsigned-${{ matrix.artifact }}
          path: |
            release/electron/*
            !release/electron/*-unpacked
            electron/generated/*
          retention-days: 14
