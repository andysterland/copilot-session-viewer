name: Desktop Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  create-draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - name: Validate tag and create protected draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          EXPECTED_TAG="v${VERSION}"
          if [[ "$GITHUB_REF_NAME" != "$EXPECTED_TAG" ]]; then
            echo "::error::Release tag $GITHUB_REF_NAME must equal $EXPECTED_TAG"
            exit 1
          fi

          EXPECTED_PRERELEASE=false
          [[ "$VERSION" == *-* ]] && EXPECTED_PRERELEASE=true

          if RELEASE_JSON="$(gh release view "$GITHUB_REF_NAME" --json isDraft,isPrerelease 2>/dev/null)"; then
            IS_DRAFT="$(jq -r '.isDraft' <<<"$RELEASE_JSON")"
            IS_PRERELEASE="$(jq -r '.isPrerelease' <<<"$RELEASE_JSON")"
            if [[ "$IS_DRAFT" != "true" ]]; then
              echo "::error::Release $GITHUB_REF_NAME is already published; refusing to replace its artifacts"
              exit 1
            fi
            if [[ "$IS_PRERELEASE" != "$EXPECTED_PRERELEASE" ]]; then
              echo "::error::Existing draft prerelease state does not match package version $VERSION"
              exit 1
            fi
          else
            PRERELEASE_ARGS=()
            [[ "$EXPECTED_PRERELEASE" == "true" ]] && PRERELEASE_ARGS+=(--prerelease)
            gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" \
              --generate-notes "${PRERELEASE_ARGS[@]}"
          fi

  build:
    needs: create-draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            command: electron:dist:win
          - os: macos-latest
            command: electron:dist:mac:release
          - os: ubuntu-latest
            command: electron:dist:linux
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ github.token }}
      ELECTRON_PRODUCTION_RELEASE: 'true'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      CSC_LINK: ${{ matrix.os == 'windows-latest' && secrets.WINDOWS_CSC_LINK || matrix.os == 'macos-latest' && secrets.MACOS_CSC_LINK || '' }}
      CSC_KEY_PASSWORD: ${{ matrix.os == 'windows-latest' && secrets.WINDOWS_CSC_KEY_PASSWORD || matrix.os == 'macos-latest' && secrets.MACOS_CSC_KEY_PASSWORD || '' }}
      APPLE_ID: ${{ matrix.os == 'macos-latest' && secrets.APPLE_ID || '' }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.os == 'macos-latest' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
      APPLE_TEAM_ID: ${{ matrix.os == 'macos-latest' && secrets.APPLE_TEAM_ID || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:electron
      - name: Build signed or unsigned desktop distribution
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == "macos-latest" ]] \
            && { [[ -z "$CSC_LINK" ]] || [[ -z "$CSC_KEY_PASSWORD" ]] \
              || [[ -z "$APPLE_ID" ]] || [[ -z "$APPLE_APP_SPECIFIC_PASSWORD" ]] \
              || [[ -z "$APPLE_TEAM_ID" ]]; }; then
            echo "::warning::macOS signing credentials are incomplete; building unsigned and without notarization"
            npm run electron:dist:mac
          else
            if [[ -z "$CSC_LINK" ]] || [[ -z "$CSC_KEY_PASSWORD" ]]; then
              echo "::warning::Code-signing credentials are not configured; building unsigned"
            fi
            npm run ${{ matrix.command }}
          fi
      - run: npm run electron:checksums
      - name: Verify Windows signature
        if: matrix.os == 'windows-latest' && env.CSC_LINK != '' && env.CSC_KEY_PASSWORD != ''
        shell: pwsh
        run: |
          $exe = Get-ChildItem release/electron/win-unpacked/copilot-session-viewer.exe
          $signature = Get-AuthenticodeSignature $exe.FullName
          if ($signature.Status -ne 'Valid') { throw "Invalid Windows signature: $($signature.Status)" }
      - name: Verify Apple signature and notarization
        if: matrix.os == 'macos-latest' && env.CSC_LINK != '' && env.CSC_KEY_PASSWORD != '' && env.APPLE_ID != '' && env.APPLE_APP_SPECIFIC_PASSWORD != '' && env.APPLE_TEAM_ID != ''
        shell: bash
        run: |
          APP_PATH="$(find release/electron -maxdepth 2 -name 'Copilot Session Viewer.app' -print -quit)"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          spctl --assess --type execute --verbose=2 "$APP_PATH"
      - name: Upload artifacts to draft release
        shell: bash
        run: |
          set -euo pipefail
          artifacts=()
          while IFS= read -r -d '' artifact; do
            artifacts+=("$artifact")
          done < <(
            find release/electron -maxdepth 1 -type f ! -name 'builder-*' -print0
            if [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
              find electron/generated -maxdepth 1 -type f -print0
            fi
          )
          test "${#artifacts[@]}" -gt 0
          gh release upload "$GITHUB_REF_NAME" "${artifacts[@]}"

  publish:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Publish only after every platform succeeds
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" = "true"
          gh release edit "$GITHUB_REF_NAME" --draft=false
