name: Desktop Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  create-draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - name: Validate tag and create protected draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          EXPECTED_TAG="v${VERSION}"
          if [[ "$GITHUB_REF_NAME" != "$EXPECTED_TAG" ]]; then
            echo "::error::Release tag $GITHUB_REF_NAME must equal $EXPECTED_TAG"
            exit 1
          fi

          EXPECTED_PRERELEASE=false
          [[ "$VERSION" == *-* ]] && EXPECTED_PRERELEASE=true

          if RELEASE_JSON="$(gh release view "$GITHUB_REF_NAME" --json isDraft,isPrerelease 2>/dev/null)"; then
            IS_DRAFT="$(jq -r '.isDraft' <<<"$RELEASE_JSON")"
            IS_PRERELEASE="$(jq -r '.isPrerelease' <<<"$RELEASE_JSON")"
            if [[ "$IS_DRAFT" != "true" ]]; then
              echo "::error::Release $GITHUB_REF_NAME is already published; refusing to replace its artifacts"
              exit 1
            fi
            if [[ "$IS_PRERELEASE" != "$EXPECTED_PRERELEASE" ]]; then
              echo "::error::Existing draft prerelease state does not match package version $VERSION"
              exit 1
            fi
          else
            PRERELEASE_ARGS=()
            [[ "$EXPECTED_PRERELEASE" == "true" ]] && PRERELEASE_ARGS+=(--prerelease)
            gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" \
              --generate-notes "${PRERELEASE_ARGS[@]}"
          fi

  build:
    needs: create-draft
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
      ELECTRON_PRODUCTION_RELEASE: 'true'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:electron
      - name: Build signed or unsigned MSI
        shell: bash
        run: |
          if [[ -z "$CSC_LINK" ]] || [[ -z "$CSC_KEY_PASSWORD" ]]; then
            echo "::warning::Code-signing credentials are not configured; building unsigned"
            unset CSC_LINK CSC_KEY_PASSWORD
          fi
          npm run electron:dist:msi
      - name: Verify Windows signature
        if: env.CSC_LINK != '' && env.CSC_KEY_PASSWORD != ''
        shell: pwsh
        run: |
          $exe = Get-ChildItem release/electron/win-unpacked/copilot-session-viewer.exe
          $signature = Get-AuthenticodeSignature $exe.FullName
          if ($signature.Status -ne 'Valid') { throw "Invalid Windows signature: $($signature.Status)" }
      - name: Upload artifacts to draft release
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' msi_artifacts < <(
            find release/electron -maxdepth 1 -type f -name '*.msi' -print0
          )
          test "${#msi_artifacts[@]}" -eq 1
          compliance_artifacts=(
            electron/generated/sbom.cdx.json
            electron/generated/THIRD_PARTY_LICENSES.txt
          )
          for artifact in "${compliance_artifacts[@]}"; do
            test -f "$artifact"
          done
          gh release upload "$GITHUB_REF_NAME" \
            "${msi_artifacts[0]}" "${compliance_artifacts[@]}" --clobber

  publish:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Publish after the Windows build succeeds
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" = "true"
          gh release edit "$GITHUB_REF_NAME" --draft=false
