name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build (Vite frontend + esbuild backend)
        run: npm run build
      
      - name: Run tests
        run: npm run test
      
      - name: Run linter
        run: npm run lint:check
      
      - name: Verify tarball before publish
        run: |
          npm pack
          TARBALL=$(ls *.tgz)
          mkdir -p /tmp/verify-tgz
          cd /tmp/verify-tgz
          npm init -y
          npm install "$GITHUB_WORKSPACE/$TARBALL"
          echo "--- Checking required files ---"
          test -f node_modules/@qiaolei81/copilot-session-viewer/dist/server.min.js
          test -f node_modules/@qiaolei81/copilot-session-viewer/dist/client/index.html
          ls node_modules/@qiaolei81/copilot-session-viewer/dist/client/assets/index-*.js > /dev/null
          ls node_modules/@qiaolei81/copilot-session-viewer/dist/client/assets/index-*.css > /dev/null
          test -f node_modules/@qiaolei81/copilot-session-viewer/bin/copilot-session-viewer
          echo "--- Checking source files excluded ---"
          test ! -d node_modules/@qiaolei81/copilot-session-viewer/src
          test ! -d node_modules/@qiaolei81/copilot-session-viewer/__tests__
          echo "--- Smoke test: server starts ---"
          export DISABLE_TELEMETRY=true
          export PORT=3839
          node node_modules/@qiaolei81/copilot-session-viewer/dist/server.min.js &
          sleep 3
          curl -sf http://localhost:3839/ > /dev/null
          kill %1
          echo "✅ Tarball verified"
          cd "$GITHUB_WORKSPACE"
          rm -rf /tmp/verify-tgz *.tgz
      
      - name: Publish to npm
        run: npm publish --provenance --access public
      
      - name: Pack tarball
        run: npm pack
      
      - name: Upload tarball to release
        uses: softprops/action-gh-release@v1
        with:
          files: '*.tgz'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
